[package]
name = "worker-rust"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }

mongodb = { version = "3.5", features = ["bson-3"] }
bson = { version = "3.1", features = ["chrono-0_4", "serde_with-3"] }
lapin = "4.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
anyhow = "1.0"
dotenvy = "0.15"

# Web Push
web-push = { version = "0.11", features = ["isahc"] }
openssl = { version = "0.10", features = ["vendored"] }
chrono = { version = "0.4.43", features = ["serde"] }